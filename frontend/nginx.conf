server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Same routing as the Vite dev proxy (vite.config.js).
    # Hostnames are the docker-compose service names. No trailing slash after
    # the port, so the full /api/... path is forwarded unchanged.
    location /api/auth/      { proxy_pass http://auth-service:8001; }
    location /api/inventory/ { proxy_pass http://inventory-service:8002; }
    location /api/orders     { proxy_pass http://order-service:8003; }

    # Vue app: unknown paths fall back to index.html
    location / { try_files $uri $uri/ /index.html; }
}
